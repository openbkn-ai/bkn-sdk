name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A package must never depend on itself: `npm install <own-name>` inside the
      # repo self-installs at the current version and ships a stale copy to every
      # consumer. npm does not reject it, so this gate does. Also runs inside
      # `npm run lint` and `prepublishOnly`; kept as its own step so a failure is
      # obvious rather than buried in lint output.
      - name: No self-dependency
        run: npm run check:deps
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The declared `engines.node` floor, actually exercised. `node-version: 22`
  # above resolves to the newest 22.x, so without this the floor would be a
  # number nothing runs — the exact claim-without-evidence this repo's engines
  # declaration was fixed to stop making. Kept as a separate job so the required
  # `ci` check keeps its name.
  engines-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm test
