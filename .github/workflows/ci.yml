name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint and test read the checkout and nothing else. Declared at the top so both
# jobs inherit it — the default token is broader than either needs, and
# `release.yml` / `automation-claude-review.yml` already scope theirs.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung suite should turn red in minutes. Without this the job runs to
    # GitHub's six-hour limit and reports `cancelled`, which reads as infra
    # trouble rather than a test that never finished — that cost two days.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A package must never depend on itself: `npm install <own-name>` inside the
      # repo self-installs at the current version and ships a stale copy to every
      # consumer. npm does not reject it, so this gate does. Also runs inside
      # `npm run lint` and `prepublishOnly`; kept as its own step so a failure is
      # obvious rather than buried in lint output.
      - name: No self-dependency
        run: npm run check:deps
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The declared `engines.node` floor, actually exercised. Without this separate
  # job, the documented lower bound would be a number nothing runs — the exact
  # claim-without-evidence this repo's engines declaration was fixed to stop
  # making. Kept separate so the required `ci` check keeps its name.
  engines-floor:
    runs-on: ubuntu-latest
    # A hung suite should turn red in minutes. Without this the job runs to
    # GitHub's six-hour limit and reports `cancelled`, which reads as infra
    # trouble rather than a test that never finished — that cost two days.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm test

  # The Python OSDK under `python/` — its own toolchain, so its own job. Every
  # test is offline: wire behaviour is asserted against exchanges recorded from a
  # live platform under `tests/fixtures/`, not against a platform.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        # Both ends of what `requires-python` promises. Testing only the floor
        # leaves the promise about newer runtimes unexercised, and testing only
        # the newest leaves the floor a claim nothing checks.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Strict, because the whole point of generating types is that a consumer's
      # type checker believes them.
      - run: mypy
      - run: pytest -q

  # The oldest `httpx` the package allows. Two of this runtime's decisions rest
  # on library behaviour rather than on our own code — the bearer is dropped on
  # a cross-origin redirect, and a stored token is refreshed once on 401 — and a
  # floor nothing runs is a floor nobody knows is broken.
  python-dependency-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: pip install "httpx==0.27.0"
      - run: pytest -q
