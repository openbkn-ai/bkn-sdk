name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-version.mjs
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error file=package.json::package.json version ($PACKAGE_VERSION) must equal tag v$TAG_VERSION"
            exit 1
          fi
      # Keep npm current for Trusted Publishing (OIDC) and release tooling.
      - run: npm install -g npm@latest
      - run: npm ci
      # Derive the npm dist-tag from the version: a prerelease (e.g.
      # 0.1.1-alpha.0) publishes under its label (`alpha`), never clobbering
      # `latest`; a stable version publishes to `latest`.
      - id: tag
        run: |
          v=$(node -p "require('./package.json').version")
          if [[ "$v" == *-* ]]; then
            label=${v#*-}; label=${label%%.*}
            echo "dist=$label" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token with npmjs.
      # Provenance is generated automatically under Trusted Publishing.
      - run: npm publish --access public --tag ${{ steps.tag.outputs.dist }}

  # The Python OSDK (`python/`, distribution `bkn-osdk`) ships from the same tag.
  # Its own job, so a failed build or upload here never holds back the npm
  # release. The version check is shared on purpose: one tag names one release,
  # so both jobs refuse a tag whose python/pyproject.toml version is not its
  # PEP 440 spelling (v0.2.1-rc.2 -> 0.2.1rc2), and a prerelease label with no
  # PEP 440 form (anything but a/alpha/b/beta/rc/dev) is refused for npm too.
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing; no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-version.mjs
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error file=package.json::package.json version ($PACKAGE_VERSION) must equal tag v$TAG_VERSION"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      # Install the wheel that is about to ship and read back its version, so
      # what lands on PyPI is what `pip install bkn-osdk==<version>` will import.
      # `-I` keeps python/ off sys.path: the import must come from the wheel,
      # not the source tree this step runs in.
      - name: Smoke-test the built wheel
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          ACTUAL="$(/tmp/smoke/bin/python -I -c 'import bkn_osdk; print(bkn_osdk.__version__)')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::built wheel reports $ACTUAL, expected $EXPECTED"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
