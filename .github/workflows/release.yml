name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be a stable X.Y.Z version; received $BASE_VERSION"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$BASE_VERSION" && "$TAG_VERSION" != "$BASE_VERSION-"* ]]; then
            echo "::error file=VERSION::tag v$TAG_VERSION must equal VERSION ($BASE_VERSION) or use it as a prerelease prefix"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error file=package.json::package.json version ($PACKAGE_VERSION) must equal tag v$TAG_VERSION"
            exit 1
          fi
      # Keep npm current for Trusted Publishing (OIDC) and release tooling.
      - run: npm install -g npm@latest
      - run: npm ci
      # Derive the npm dist-tag from the version: a prerelease (e.g.
      # 0.1.1-alpha.0) publishes under its label (`alpha`), never clobbering
      # `latest`; a stable version publishes to `latest`.
      - id: tag
        run: |
          v=$(node -p "require('./package.json').version")
          if [[ "$v" == *-* ]]; then
            label=${v#*-}; label=${label%%.*}
            echo "dist=$label" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token with npmjs.
      # Provenance is generated automatically under Trusted Publishing.
      - run: npm publish --access public --tag ${{ steps.tag.outputs.dist }}
