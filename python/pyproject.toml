[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bkn-osdk"
version = "0.2.1rc2"
description = "Generated, read-only ontology SDK for BKN knowledge networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenBKN" }]
keywords = ["bkn", "ontology", "osdk", "knowledge-network"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# The runtime's only hard dependency. Generated packages import `bkn_osdk` and
# nothing else, so a consumer's dependency tree stays this short.
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/openbkn-ai/bkn-sdk"
Source = "https://github.com/openbkn-ai/bkn-sdk/tree/main/python"
Issues = "https://github.com/openbkn-ai/bkn-sdk/issues"

[project.optional-dependencies]
# `pyyaml` is a generation-time dependency only: `scripts/capture_kn_contract.py`
# reads foundry's OpenAPI and freezes it as JSON, so the runtime keeps httpx alone.
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "pyyaml>=6", "types-PyYAML>=6"]

[project.scripts]
bkn-osdk = "bkn_osdk.codegen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bkn_osdk"]

# Only what a source build and its tests need; a local virtualenv or cache in
# python/ must never ride along into the published sdist.
[tool.hatch.build.targets.sdist]
include = ["/bkn_osdk", "/tests", "/README.md", "/README.zh.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Golden files are generator output compared byte-for-byte; a formatter touching
# them would silently rewrite the thing under test. The emitter is responsible
# for emitting lint-clean code, and `test_emit.py` checks that separately.
extend-exclude = ["tests/fixtures/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `kn.py` carries the platform's own Chinese prose as docstrings, punctuation
# included. Rewriting `；` to `;` would edit the platform's words to satisfy a
# lint about characters that look like ASCII — the text is not code.
"bkn_osdk/kn.py" = ["RUF001", "RUF002", "RUF003"]
# The capture script carries the platform's own Chinese notes into that file.
"scripts/capture_kn_contract.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["bkn_osdk", "tests", "scripts"]
# Goldens reference runtime base classes that land with the query layer; they are
# type-checked as generated output once those exist.
exclude = ["tests/fixtures/golden/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live suite skips itself unless BKN_E2E=1, so a plain run stays offline.
markers = ["e2e: runs against a live platform"]
